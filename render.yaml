%YAML 1.1
---
# Render Blueprint — connect this repo as a Blueprint in the Render dashboard
# and it provisions everything below in one go. See README.md's Deployment
# section for the full walkthrough (env vars to fill in, migration step,
# connecting the Vercel frontend).
#
# Everything on `free` — no card required. There's no separate worker
# service: app/worker.py's consumer loop runs in-process inside the API
# (started from app.main's lifespan), so the whole app fits on one free web
# service instead of needing a paid worker instance (Render's free tier
# doesn't offer those at all). The tradeoff: the free web service cold-starts
# after 15 min idle, the free Postgres is deleted after 30+14 days unless
# upgraded, and the free Key Value loses its data on restart — all fine here
# since this project's data is synthetic demo traffic, not something that
# matters if it's ever reset. Bump any plan below if you want it durable.

services:
  - name: incidentops-api
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incidentops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: incidentops-redis
          type: keyvalue
          property: connectionString
      - key: INGESTION_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - name: incidentops-redis
    type: keyvalue
    plan: free
    ipAllowList: []

databases:
  - name: incidentops-db
    plan: free
